{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h1 class="fw-bold">
            Novo Chamado
        </h1>

        <p class="text-muted">
            Registre uma nova solicitação de suporte.
        </p>

    </div>

    <a
        href="/dashboard"
        class="btn btn-outline-dark"
    >
        Voltar
    </a>

</div>

<div class="card shadow-sm border-0">

    <div class="card-body">

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">

                <label class="form-label">
                    Título
                </label>

                <input
                    type="text"
                    name="titulo"
                    class="form-control"
                    placeholder="Ex: Erro ao acessar o sistema"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Descrição
                </label>

                <textarea
                    name="descricao"
                    class="form-control"
                    rows="5"
                    placeholder="Descreva o problema com detalhes."
                    required
                ></textarea>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Prioridade
                </label>

                <select
                    name="prioridade"
                    class="form-select"
                >

                    <option value="Baixa">
                        Baixa
                    </option>

                    <option value="Média">
                        Média
                    </option>

                    <option value="Alta">
                        Alta
                    </option>

                </select>
		<div class="mb-4">

    <label class="form-label">
        Anexo
    </label>

    <input
        type="file"
        name="anexo"
        class="form-control"
        accept=".png,.jpg,.jpeg,.pdf"
    >

    <div class="form-text">
        Envie um print, imagem ou PDF que ajude o suporte a entender o problema.
    </div>

</div>
            </div>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Abrir Chamado
            </button>

        </form>

    </div>

</div>

{% endblock %}
