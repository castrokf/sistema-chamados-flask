<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cadastro - Sistema de Chamados</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <div class="container">

        <div
            class="row justify-content-center align-items-center"
            style="height: 100vh;"
        >

            <div class="col-md-5">

                <div class="card shadow border-0">

                    <div class="card-body p-5">

                        <h2 class="text-center fw-bold mb-2">
                            Criar Conta
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Cadastre-se para abrir e acompanhar chamados.
                        </p>

                        {% with messages = get_flashed_messages(with_categories=true) %}

                            {% if messages %}

                                {% for categoria, mensagem in messages %}

                                    <div class="alert alert-{{ categoria }} alert-dismissible fade show">

                                        {{ mensagem }}

                                        <button
                                            type="button"
                                            class="btn-close"
                                            data-bs-dismiss="alert"
                                        ></button>

                                    </div>

                                {% endfor %}

                            {% endif %}

                        {% endwith %}

                        <form method="POST">

                            <div class="mb-3">

                                <label class="form-label">
                                    Nome
                                </label>

                                <input
                                    type="text"
                                    name="nome"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Senha
                                </label>

                                <input
                                    type="password"
                                    name="senha"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <div class="mb-4">

                                <label class="form-label">
                                    Confirmar Senha
                                </label>

                                <input
                                    type="password"
                                    name="confirmar_senha"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <button
                                type="submit"
                                class="btn btn-success w-100"
                            >
                                Criar Conta
                            </button>

                        </form>

                        <hr>

                        <p class="text-center mb-2">

                            Já possui conta?

                            <a href="/login">
                                Fazer login
                            </a>

                        </p>

                        <p class="text-center mb-0">

                            <a href="/" class="text-muted">
                                Voltar para a página inicial
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
