<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Nortia</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="{{ url_for('static', filename='css/style.css') }}?v=14"
        rel="stylesheet"
    >

</head>

<body>

    <div class="public-layout">

        <div class="public-card">

            <div class="auth-icon mx-auto mb-4">
                <img
                    src="{{ url_for('static', filename='img/logo.svg') }}"
                    alt="Logo do Nortia"
                >
            </div>

            <span class="public-label">
                Nortia
            </span>

            <h1>
                Atendimento interno com padrão profissional
            </h1>

            <p>
                Centralize chamados, responsáveis, prazos, comentários e anexos em uma operação
                controlada para equipes internas de atendimento.
            </p>

            <div class="public-actions">

                <a
                    href="/login"
                    class="btn btn-primary"
                >
                    Acessar Nortia
                </a>

            </div>

            <p class="public-note">
                Acesso restrito a usuários previamente cadastrados pela equipe responsável.
            </p>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
