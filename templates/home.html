<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sistema de Chamados</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="{{ url_for('static', filename='css/style.css') }}?v=7"
        rel="stylesheet"
    >

</head>

<body>

    <div class="public-layout">

        <div class="public-card">

            <div class="auth-icon mx-auto mb-4">
                <img
                    src="{{ url_for('static', filename='img/logo.svg') }}"
                    alt="Logo da Central de Atendimento"
                >
            </div>

            <span class="public-label">
                Plataforma de atendimento
            </span>

            <h1>
                Sistema de Chamados
            </h1>

            <p>
                Organize solicitações, acompanhe atendimentos, registre responsáveis,
                prazos, comentários e anexos em um único ambiente.
            </p>

            <div class="public-actions">

                <a
                    href="/login"
                    class="btn btn-primary"
                >
                    Fazer Login
                </a>

                <a
                    href="/register"
                    class="btn btn-outline-light"
                >
                    Criar Conta
                </a>

            </div>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
